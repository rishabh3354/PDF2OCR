name: pdf2go
base: core22
version: '2026.10.2'
title: PDF2OCR
summary: "Offline OCR: turn scanned PDFs, photos and screenshots into editable text"
description: |
  PDF2OCR turns scanned PDFs, photographed pages, images and screenshots into
  text you can edit, search, copy and save. Recognition runs entirely on your
  computer with Tesseract OCR: your documents are never uploaded, and the text
  is never translated or rewritten - you get exactly what is on the page.

  **Read whole documents at once**
  * Open PDFs, multi-page TIFFs and images, whole folders, or drag them in
  * All pages are recognized in parallel, with progress and a Stop button
  * Digital PDFs keep their exact text; OCR is only used where it is needed
  * Pick the languages of your document: 15 built in, 100+ more in one click

  **Clean results from imperfect sources**
  * Sideways, upside-down and slightly tilted pages are straightened automatically
  * Photographed pages are flattened: the page corners are found for you
  * Optional cleanup for faded scans, coloured paper, specks and small screenshots
  * Words that may be misread are flagged in the text and on the page

  **Get just what you need**
  * Select an area of a page to read only that part
  * Copy a table and paste it straight into LibreOffice Calc or Excel as cells
  * Page image and text are linked word by word for quick proofreading
  * Find & replace across all pages

  **From anywhere**
  * Paste a screenshot, or capture an area of the screen
  * Quick capture: press a keyboard shortcut anywhere and the text of the
    selected area lands on your clipboard (pdf2go --capture)
  * Scan directly from USB and network scanners, including document feeders

  **Save it your way**
  * Searchable PDF, Word, LibreOffice, Markdown, plain text, Excel and CSV
  * Your work is saved automatically and comes back after a restart or crash
  * Batch conversion from the terminal: pdf2go --to pdf ~/Scans

  Free and open source (MIT).

  USB scanners need a one-time permission: sudo snap connect pdf2go:raw-usb
license: MIT
website: https://warlordsoftwares.com/
source-code: https://github.com/rishabh3354/PDF2OCR
issues: https://github.com/rishabh3354/PDF2OCR/issues
contact: https://warlordsoftwares.com/contact-us/
donation: https://www.paypal.com/paypalme/rishabh3354/10
confinement: strict

icon: snap/gui/icon.png

architectures:
  - build-on: [amd64]

environment:
  SNAP_DESKTOP_RUNTIME: $SNAP/pyqt5-runtime-core22-lite

apps:
  pdf2go:
    command: bin/desktop-launch python3 $SNAP/pdf2go.py
    plugs: 
       - home
       - gsettings
       - network
       - network-bind
       - network-status
       - desktop
       - desktop-legacy
       - x11
       - unity7
       - wayland
       - opengl
       - optical-drive
       - removable-media
       # Scanning: USB scanners need `snap connect pdf2go:raw-usb` (not auto-connected);
       # network scanners are found through Avahi.
       - raw-usb
       - hardware-observe
       - avahi-observe
    desktop: pdf2go.desktop
    environment:
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/4.00/tessdata
      DISABLE_WAYLAND: 1
      # The bundled Qt runtime has no Wayland plugin. Override any user-wide
      # QT_QPA_PLATFORM=wayland(-egl), which otherwise aborts at start-up.
      QT_QPA_PLATFORM: xcb

plugs:
  gsettings:
  gtk-3-themes:
    interface: content
    target: $SNAP/data-dir/themes
    default-provider: gtk-common-themes
  icon-themes:
    interface: content
    target: $SNAP/data-dir/icons
    default-provider: gtk-common-themes
  sound-themes:
    interface: content
    target: $SNAP/data-dir/sounds
    default-provider: gtk-common-themes
  pyqt5-runtime-core22-lite:
    interface: content
    target: $SNAP/pyqt5-runtime-core22-lite
    default-provider: pyqt5-runtime-core22-lite


parts:
  desktop-gui:
    plugin: dump
    source: src/
    override-build: |
      snapcraftctl build
      sed -i 's|Icon=.*|Icon=${SNAP}/meta/gui/icon.png|g' ${SNAPCRAFT_PART_SRC}/pdf2go.desktop
      mkdir -p ${SNAPCRAFT_PART_INSTALL}/usr/share/applications/
      cp -rf ${SNAPCRAFT_PART_SRC}/pdf2go.desktop ${SNAPCRAFT_PART_INSTALL}/usr/share/applications/pdf2go.desktop


  snap-launcher:
    plugin: dump
    source: snap_launcher/

  pdf2go:
      plugin: python
      source: .
      python-packages: 
          - Pillow
          - pypdf>=4.0
      stage-packages:
        - poppler-utils
        - tesseract-ocr
        # Scanning (SANE). sane-airscan drives most network scanners without vendor drivers.
        - sane-utils
        - libsane1
        - sane-airscan
        # Lets the app add its quick-capture keyboard shortcut on GNOME.
        - dconf-cli
        - tesseract-ocr-osd
        # Bundled languages; users can download any other one from inside the app.
        - tesseract-ocr-eng
        - tesseract-ocr-deu
        - tesseract-ocr-fra
        - tesseract-ocr-spa
        - tesseract-ocr-ita
        - tesseract-ocr-por
        - tesseract-ocr-nld
        - tesseract-ocr-pol
        - tesseract-ocr-rus
        - tesseract-ocr-ukr
        - tesseract-ocr-tur
        - tesseract-ocr-ara
        - tesseract-ocr-hin
        - tesseract-ocr-chi-sim
        - tesseract-ocr-jpn
